workflows:
  ios-release:
    name: iOS Release Build
    max_build_duration: 60

    environment:
      xcode: 26.3
      groups:
        - bridgecall
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bridgecall.app

    integrations:
      app_store_connect: BridgeCall Key

    scripts:
      - name: Get packages
        script: |
          cd /Users/builder/clone
          flutter clean
          flutter pub get

      - name: Validate production environment
        script: |
          REQUIRED_VARS=(
            WS_URL
            BACKEND_HTTP_URL
            REVENUECAT_IOS_API_KEY
            TWILIO_TURN_URLS
            TWILIO_TURN_USERNAME
            TWILIO_TURN_PASSWORD
            TURN_URLS
            TURN_USERNAME
            TURN_PASSWORD
          )
          for VAR_NAME in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!VAR_NAME}" ]; then
              echo "Missing required Codemagic environment variable: $VAR_NAME"
              echo "Add it to the secure 'bridgecall' environment group before App Store builds."
              exit 1
            fi
          done

      - name: Set signing
        script: |
          cd /Users/builder/clone
          xcode-project use-profiles

      - name: Create export options
        script: |
          cat > /Users/builder/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>CDY9NL37S7</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bridgecall.app</key>
              <string>bridgellcall</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        script: |
          cd /Users/builder/clone
          flutter build ipa --release \
            --dart-define=WS_URL=$WS_URL \
            --dart-define=BACKEND_HTTP_URL=$BACKEND_HTTP_URL \
            --dart-define=REVENUECAT_IOS_API_KEY=$REVENUECAT_IOS_API_KEY \
            --dart-define=TWILIO_TURN_URLS=$TWILIO_TURN_URLS \
            --dart-define=TWILIO_TURN_USERNAME=$TWILIO_TURN_USERNAME \
            --dart-define=TWILIO_TURN_PASSWORD=$TWILIO_TURN_PASSWORD \
            --dart-define=TURN_URLS=$TURN_URLS \
            --dart-define=TURN_USERNAME=$TURN_USERNAME \
            --dart-define=TURN_PASSWORD=$TURN_PASSWORD \
            --export-options-plist=/Users/builder/exportOptions.plist

      - name: Show output
        script: |
          cd /Users/builder/clone
          ls -R build/ios || true

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarhive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
